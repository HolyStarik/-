services:
  - type: web
    name: schedule-bot-451
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot_render:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: AUTO_CHAT_ID
        sync: false
